<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeSight AI | Verified Housing Platform</title>

<meta name="description" content="AI powered house price prediction and housing analysis platform with verified listings and interactive maps.">

<link rel="icon" href="/favicon.png">

<script src="https://cdn.tailwindcss.com"></script>





<style>

:root{
--brand-cyan:#00AEEF;
--brand-cyan-muted:rgba(0,174,239,0.05);
--brand-cyan-glow:rgba(0,174,239,0.1);

--bg-main:#F1F5F9;
--bg-secondary:#E2E8F0;

--text-main:#0F172A;
--text-muted:#64748B;

--border-main:rgba(0,0,0,0.05);
}

* {
  font-family: Arial, Helvetica, sans-serif !important;
}

body, button, input, select, textarea {
background:var(--bg-main);
color:var(--text-main);
margin:0;
}

/* text selection */

::selection{
background:var(--brand-cyan);
color:white;
}

/* scrollbar */

::-webkit-scrollbar{
width:8px;
background:var(--bg-secondary);
}

::-webkit-scrollbar-thumb{
background:#E2E8F0;
border-radius:10px;
border:2px solid var(--bg-secondary);
}

::-webkit-scrollbar-thumb:hover{
background:var(--brand-cyan);
}

/* glass effect */

.glass{
background:rgba(255,255,255,0.85);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}

/* map marker */

.custom-price-marker{
background:white;
border:2px solid #4F46E5;
border-radius:8px;
padding:2px 6px;
font-weight:800;
font-size:11px;
color:#4F46E5;
white-space:nowrap;
box-shadow:0 4px 6px rgba(0,0,0,0.1);
transition:all 0.2s;
}

.custom-price-marker:hover{
transform:scale(1.1);
}

</style>


</head>

<body>

<!-- React App Root -->
<div id="root"></div>

<!-- React Entry File -->
<script type="module" src="/index.tsx"></script>

</body>
</html>
